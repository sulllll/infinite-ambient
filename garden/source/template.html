<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=color-scheme content=dark>
<title>Abyssal Garden</title>
<link rel=stylesheet href="../shared/style.css">
<style>
/* The classes on <body>: l while the world is built (l e: it failed to start), swim while you swim.
   panel and idle come from the shared Infinite Ambient style, which also styles the settings panel. */
html, body { background: #02101a; }
.swim canvas#c { cursor: crosshair; }
/* a short fade to dark: back from swimming, or when the clock wraps after hours */
canvas#c.dip { opacity: 0; transition: opacity .8s ease; }

/* loading: title, a thin progress bar and what is being built */
#m {
  position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px;
  padding: 16px; text-align: center; background: radial-gradient(#0b3a4d66, #02101a 70%);
  transition: opacity 1.5s ease, visibility 1.5s;
}
body:not(.l) #m { opacity: 0; visibility: hidden; }
#m h1 { margin: 0; font-size: clamp(26px, 4vw, 40px); font-weight: 600; letter-spacing: -0.01em; }
#p { width: min(280px, 70vw); height: 3px; border-radius: 3px; overflow: hidden; background: rgba(255, 255, 255, 0.12); }
#b { display: block; height: 100%; background: var(--accent); transform: scaleX(0); transform-origin: 0; will-change: transform; }
#s, #w { margin: 0; color: var(--ink-soft); }
.e #p { visibility: hidden; }
.e #s { max-width: 50ch; color: #ffc9c9; }
.l #ia-btn { display: none; }

/* H: the stats line */
#i {
  position: fixed; top: 12px; left: 16px; margin: 0; font: 12px/1.6 ui-monospace, Consolas, monospace;
  white-space: pre-wrap; text-shadow: 0 1px 4px #000; pointer-events: none;
}
</style>
</head>
<body class=l>
<canvas id=c></canvas>
<div id=m>
  <h1>Abyssal Garden</h1>
  <div id=p><i id=b></i></div>
  <p id=s>Diving…</p>
  <p id=w hidden>Best in Chrome or Edge</p>
</div>
<pre id=i></pre>
<script>
/*SCRIPT*/
</script>
</body>
</html>
